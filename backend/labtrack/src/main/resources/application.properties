spring.application.name=labtrack

# ============================================================
# PostgreSQL Database - SUPABASE
# ============================================================

spring.datasource.url=jdbc:postgresql://aws-0-ap-south-1.pooler.supabase.com:5432/postgres
spring.datasource.username=postgres.ilmwbitonokbjfdvnxku
spring.datasource.password=${DATABASE_PASSWORD}

# SSL is required for the Supabase database connection
spring.datasource.hikari.data-source-properties.sslmode=require


# ============================================================
# JPA
# ============================================================

# Validate the existing production schema.
# Hibernate must NOT create or modify production tables.
spring.jpa.hibernate.ddl-auto=validate

spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true


# ============================================================
# Flyway
# ============================================================

# Disabled because the Supabase production schema was
# already created and migrated manually.
spring.flyway.enabled=false


# ============================================================
# Server
# ============================================================

server.port=8080


# ============================================================
# Logging
# ============================================================

logging.level.org.springframework=INFO
logging.level.org.hibernate.SQL=INFO
logging.level.org.springframework.security=INFO
logging.level.com.prangyajeet.labtrack=INFO



# ============================================================
# JWT
# ============================================================

jwt.secret=${JWT_SECRET}
jwt.expiration=86400000


# ============================================================
# FILE UPLOAD CONFIGURATION
# ============================================================

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

labtrack.file-storage.sop-dir=uploads/sops

# ============================================================
# SUPABASE STORAGE
# ============================================================

supabase.storage.url=https://ilmwbitonokbjfdvnxku.supabase.co
supabase.storage.secret-key=${SUPABASE_STORAGE_SECRET_KEY}

supabase.storage.amc-bucket=amc-documents
supabase.storage.sop-bucket=sop-documents
supabase.storage.consumable-photo-bucket=consumable-photos